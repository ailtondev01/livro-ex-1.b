<meta charset="UTF-8">
<script>
    const total = Number(prompt("Digite o total da conta")) //insere o valor total da conta
    const clientes = Number(prompt("Dividir em quantos clientes?")) //inserir quantos clientes irão dividir a conta
    const vpc = (total / clientes) //divide o valor pelo número de clientes
    alert(`Valor da Conta R$: ${total.toFixed(2)}\nNúmero de Clientes: ${clientes}\nValor por Cliente R$: ${vpc.toFixed(2)}`)
</script>
